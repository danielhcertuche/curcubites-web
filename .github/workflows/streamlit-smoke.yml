name: Streamlit smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile app
        run: python -m py_compile app.py

      - name: Run Streamlit interaction smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py").run(timeout=15)
          assert not at.exception, at.exception
          at.button(key="add_curcubites-150g").click().run(timeout=15)
          assert not at.exception, at.exception
          assert at.session_state["cart"]["curcubites-150g"] == 1
          print("ok")
          PY
